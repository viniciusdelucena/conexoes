<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset=".5" stop-color="#e63b48"/>
      <stop offset="1" stop-color="#a8142a"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aneL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe3df"/>
    </linearGradient>
    <linearGradient id="aneR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2cb"/><stop offset="1" stop-color="#ffb3ad"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#5a0010" flood-opacity=".38"/>
    </filter>
    <clipPath id="cima"><rect x="212" y="120" width="88" height="136"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <rect width="512" height="512" fill="url(#brilho)"/>
  <g fill="none" stroke-width="34" filter="url(#sombra)">
    <circle cx="204" cy="256" r="74" stroke="url(#aneL)"/>
    <circle cx="308" cy="256" r="74" stroke="url(#aneR)"/>
    <circle cx="204" cy="256" r="74" stroke="url(#aneL)" clip-path="url(#cima)"/>
  </g>
</svg>
